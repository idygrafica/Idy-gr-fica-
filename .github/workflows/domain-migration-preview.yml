name: Domínio idygrafica.com.br — SEO e preservação da loja
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    name: Código, SEO e loja
    if: github.head_ref == 'codex/seo-dominio-idygrafica-com-br'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar os 100 testes comerciais existentes
        run: |
          node scripts/loja/cart.test.mjs
          node scripts/loja/canetas.test.mjs
          node scripts/digital-products/pricing.test.mjs
          node scripts/approved-prices/pricing.test.mjs
          node scripts/pastas-prices/pricing.test.mjs
      - name: Preparar navegador isolado
        run: npm install --prefix .preview-tools --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Conferir metadados, build, preservação e loja
        env:
          PREVIEW_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--idygrafica.netlify.app
        run: node scripts/domain-migration/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominio-seo-previa-e-testes
          include-hidden-files: true
          path: .preview/domain-migration/
  public-domain:
    name: DNS e HTTPS públicos
    if: github.head_ref == 'codex/seo-dominio-idygrafica-com-br'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir DNS, certificado e sitemap público sem alterar hospedagem
        run: node scripts/domain-migration/audit-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominio-dns-https-auditoria
          include-hidden-files: true
          path: .preview/domain-migration/
