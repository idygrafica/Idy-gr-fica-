name: Apostilas — revisão comercial e prévia
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - impressao-de-apostilas.html
      - assets/impressao-de-apostilas.css
      - impressos.html
      - livros-digitais.html
      - sitemap.xml
      - netlify.toml
      - scripts/apostilas/**
      - APOSTILAS_REVISAO.md
      - .github/workflows/apostilas-preview.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'codex/apostilas-porto-alegre'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar os 100 testes comerciais existentes
        run: |
          node scripts/loja/cart.test.mjs
          node scripts/loja/canetas.test.mjs
          node scripts/digital-products/pricing.test.mjs
          node scripts/approved-prices/pricing.test.mjs
          node scripts/pastas-prices/pricing.test.mjs
      - name: Preparar navegador isolado
        run: npm install --prefix .preview-tools --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Conferir preservação, SEO, links, loja e apresentação
        env:
          PREVIEW_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--idygrafica.netlify.app
        run: node scripts/apostilas/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apostilas-previa-e-testes
          include-hidden-files: true
          path: .preview/apostilas/
