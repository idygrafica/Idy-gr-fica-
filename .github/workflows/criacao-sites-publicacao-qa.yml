name: Criação de Sites — conferência pública somente leitura
on:
  push:
    branches: [qa/criacao-sites-publicacao-20261028]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92583ed7e5615c28aed7350897d80c4d6e297064
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar automação com Chrome disponível
        run: npm install --prefix .preview-tools --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Conferir vitrine aprovada no endereço oficial
        env:
          PREVIEW_ORIGIN: https://idygrafica.netlify.app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/criacao-sites/check.mjs');s=p.read_text()
          changes=[
           ("assert.match(headers.get('x-robots-tag')||'',/noindex/i,'Proteção da prévia');", "assert(!/noindex/i.test(headers.get('x-robots-tag')||''),'Produção bloqueada por noindex');"),
           ("for(const origin of [local,preview]){", "for(const origin of [preview]){"),
           ("await page.goto(local+'/criacao-sites',{waitUntil:'load'});", "await page.goto(preview+'/criacao-sites',{waitUntil:'load'});"),
           ("assert(!(await prod.text()).includes('id=\"wb-title\"'),'Não publicar em produção antes da aprovação');", "assert((await prod.text()).includes(expected),'Produção não corresponde à vitrine aprovada');"),
           ("origin:origin===preview?'Netlify':'local'", "origin:'produção'"),
           ("criacao-sites-${origin===preview?'netlify':'local'}-${width}.png", "criacao-sites-producao-${width}.png"),
           ("importantPagesAccessible:12", "publicUrl:preview,motionVerified:true,publicAssetsVerified:2,importantPagesAccessible:12"),
           ("productionPublished:false", "productionPublished:true")
          ]
          for old,new in changes:
           assert old in s,old
           s=s.replace(old,new)
          asset_check="for(const file of ['assets/criacao-sites.css','assets/criacao-sites.js']){const response=await fetch(preview+'/'+file);assert.equal(response.status,200);assert.equal(await response.text(),await readFile(file,'utf8'),'Recurso público diferente da versão aprovada');}\n"
          s=s.replace(' for(const origin of [preview]){',asset_check+' for(const origin of [preview]){')
          motion='''
          const motionCtx=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'no-preference'});
          await motionCtx.route(/https:\/\/[^/]*netlify[^/]*\/.*(?:\.netlify\/cdp|netlify-cdp)/,r=>r.abort());
          const motionPage=await motionCtx.newPage(),motionErrors=[];motionPage.on('pageerror',e=>motionErrors.push(e.message));
          assert.equal((await motionPage.goto(preview+'/criacao-sites',{waitUntil:'domcontentloaded'})).status(),200);await settle(motionPage);
          assert.notEqual(await motionPage.locator('.wb-laptop').evaluate(e=>getComputedStyle(e).animationName),'none');
          await motionPage.waitForFunction(()=>document.querySelector('.wb-laptop').getAnimations().every(a=>a.playState==='finished'),null,{timeout:5000});
          assert.equal(await motionPage.locator('.wb-laptop').evaluate(e=>getComputedStyle(e).opacity),'1');
          await motionPage.locator('.wb-format').first().scrollIntoViewIfNeeded();
          await motionPage.waitForFunction(()=>document.querySelector('.wb-format').classList.contains('wb-inview'),null,{timeout:5000});
          await motionPage.waitForFunction(()=>document.querySelector('.wb-format').getAnimations().every(a=>a.playState==='finished'),null,{timeout:5000});
          assert.equal(await motionPage.locator('.wb-format').first().evaluate(e=>getComputedStyle(e).opacity),'1');
          assert.deepEqual(motionErrors,[]);await motionCtx.close();
          '''
          assert ' const fallback=' in s
          s=s.replace(' const fallback=',motion+' const fallback=')
          p.write_text(s)
          PY
          node scripts/criacao-sites/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criacao-sites-publicacao-verificada
          include-hidden-files: true
          path: .preview/criacao-sites/
