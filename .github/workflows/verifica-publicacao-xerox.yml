name: Verifica publicação Xerox no Netlify
on:
  push:
    branches: [codex/verifica-publicacao-xerox]
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser for read-only public verification
        run: |
          npm install --prefix .preview-tools --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.55.0
          ./.preview-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify published version and controls
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/.preview-tools/node_modules/playwright
        run: node scripts/check-public-xerox.cjs
      - name: Save public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xerox-publicada-netlify
          path: .preview/xerox-publicada/
          retention-days: 14
