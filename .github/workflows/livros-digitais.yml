name: Livros Digitais — revisão e prévia sem publicação
on:
  push:
    branches: [codex/livros-digitais-comercial]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar cálculos e carrinho existentes
        run: |
          node scripts/loja/cart.test.mjs
          node scripts/loja/canetas.test.mjs
      - name: Instalar navegador de testes isolado
        run: |
          npm install --prefix .preview-tools --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.55.0
          ./.preview-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Conferir página, SEO, links e preservação da loja
        env:
          PREVIEW_ORIGIN: https://deploy-preview-12--idygrafica.netlify.app
        run: node scripts/livros/check.mjs
      - name: Conferir fluxos existentes da loja
        run: node scripts/loja/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livros-digitais-revisao
          include-hidden-files: true
          path: |
            .preview/livros/
            .preview/loja/browser-report.json
