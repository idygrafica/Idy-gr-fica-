name: Confirm institutional publication
on:
  push:
    branches: [codex/mobile-composition-validation]
concurrency:
  group: institutional-mobile-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright pngjs
          npx playwright install --with-deps chromium
      - name: Inspect original asset and published institutional version
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          (async()=>{
           const browser=await chromium.launch(),page=await browser.newPage();
           const base='https://idygrafica.netlify.app/';
           let published=false;
           for(let attempt=1;attempt<=30;attempt++){
            const token='?verify='+Date.now();
            const html=await page.request.get(base+token),css=await page.request.get(base+'assets/mobile-phone-reference.css'+token);
            const ok=html.status()===200&&css.status()===200&&(await html.text())===fs.readFileSync('index.html','utf8')&&(await css.text())===fs.readFileSync('assets/mobile-phone-reference.css','utf8');
            console.log('PUBLICATION_CHECK '+JSON.stringify({attempt,htmlStatus:html.status(),cssStatus:css.status(),filesMatch:ok}));
            if(ok){published=true;break}await page.waitForTimeout(5000);
           }
           assert(published,'Netlify not serving committed files within verification window');
           const raw=await page.request.get(base+'assets/mascote-idy.png');
           console.log('ORIGINAL_MASCOT '+JSON.stringify({status:raw.status(),sha256:crypto.createHash('sha256').update(await raw.body()).digest('hex')}));
           for(const width of [320,390,430,620,1280]){
            await page.setViewportSize({width,height:1000});await page.goto(base+'?layout='+Date.now());await page.evaluate(()=>Promise.all([...document.images].map(e=>e.decode().catch(()=>{}))));
            const r=await page.evaluate(()=>{
             const img=[...document.querySelectorAll('.hero-mascot')].find(e=>getComputedStyle(e).display!=='none');
             return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,mascotWidth:img.getBoundingClientRect().width,titleColor:getComputedStyle(document.querySelector('.hero h1 span')).color,ai:document.querySelector('.cta-ai-copy strong').innerText,badges:document.querySelectorAll('.hero .badge').length,aiVisible:document.querySelector('.cta-ai').getBoundingClientRect().width>0};
            });
            assert.equal(r.scrollWidth,width);assert.equal(r.badges,4);assert(r.aiVisible);if(width<=620){assert.equal(r.mascotWidth,405);assert.equal(r.titleColor,'rgb(53, 238, 72)');}
            console.log('LIVE_LAYOUT '+JSON.stringify(r));
            if(width===390){
             const height=await page.evaluate(()=>Math.ceil(document.querySelector('.whats-widget').getBoundingClientRect().bottom));await page.setViewportSize({width,height});
             console.log('LIVE_PREVIEW_390 '+(await page.screenshot({type:'jpeg',quality:70,clip:{x:0,y:0,width,height}})).toString('base64'));
            }
           }
           await browser.close();console.log('PUBLICATION_CONFIRMED commit=bf73be43d1fd64926234535938482c611150a90e');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
