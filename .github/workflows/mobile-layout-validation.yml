name: Validate institutional mobile composition
on:
  push:
    branches: [codex/mobile-composition-validation]
concurrency:
  group: institutional-mobile-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Inspect original asset and published institutional version
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),http=require('http'),path=require('path');
          (async()=>{
           const server=http.createServer((req,res)=>{
             const url=new URL(req.url,'http://localhost');
             const file=path.join(process.cwd(),decodeURIComponent(url.pathname==='/'?'/index.html':url.pathname));
             if(!file.startsWith(process.cwd())||!fs.existsSync(file)){res.writeHead(404);return res.end();}
             res.setHeader('Content-Type',file.endsWith('.css')?'text/css':file.endsWith('.png')?'image/png':file.endsWith('.js')?'application/javascript':'text/html');
             res.end(fs.readFileSync(file));
           });
           await new Promise(r=>server.listen(0,'127.0.0.1',r));
           const origin='http://127.0.0.1:'+server.address().port;
           const browser=await chromium.launch();
           const page=await browser.newPage();
           for(const width of [320,360,390,430,620]){
             await page.setViewportSize({width,height:1000});
             await page.goto(origin);
             await page.evaluate(()=>Promise.all([...document.images].map(e=>e.decode().catch(()=>{}))));
             const polygon=await page.evaluate(()=>{
               const img=document.querySelector('.hero-mascot'),r=img.getBoundingClientRect();
               const c=document.createElement('canvas');c.width=Math.round(r.width);c.height=Math.ceil(r.height);
               const cx=c.getContext('2d');cx.drawImage(img,0,0,c.width,c.height);
               const d=cx.getImageData(0,0,c.width,c.height).data,points=[];
               for(let y=0;y<c.height;y+=12){
                 let left=c.width;
                 for(let yy=y;yy<Math.min(y+12,c.height);yy++)for(let x=0;x<left;x++)if(d[(yy*c.width+x)*4+3]>26){left=x;break}
                 const px=Math.max(0,left-2)/c.width*100;
                 points.push(px.toFixed(2)+'% '+(y/c.height*100).toFixed(2)+'%',px.toFixed(2)+'% '+(Math.min(y+12,c.height)/c.height*100).toFixed(2)+'%');
               }
               points.push('100% 100%','100% 0%');
               const shape='polygon('+points.join(',')+') border-box';
               img.style.setProperty('shape-outside',shape,'important');
               return shape;
             });
             if(width===390)console.log('POLYGON '+polygon);
             const result=await page.evaluate(()=>{
               const img=document.querySelector('.hero-mascot'),ir=img.getBoundingClientRect();
               const c=document.createElement('canvas');c.width=Math.round(ir.width);c.height=Math.round(ir.height);
               const cx=c.getContext('2d');cx.drawImage(img,0,0,c.width,c.height);
               const pixels=cx.getImageData(0,0,c.width,c.height).data;
               const collisions=[],outside=[];
               for(const el of document.querySelectorAll('.hero .eyebrow,.hero h1,.hero p')){
                 const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
                 let n;
                 while(n=walker.nextNode()){
                   for(let i=0;i<n.length;i++){
                     if(!n.textContent[i].trim())continue;
                     const range=document.createRange();range.setStart(n,i);range.setEnd(n,i+1);
                     const r=range.getBoundingClientRect();
                     if(r.left<0||r.right>innerWidth+.5)outside.push(n.textContent[i]);
                     let hit=false;
                     for(let y=Math.max(0,Math.ceil(r.top-ir.top));y<Math.min(c.height,Math.floor(r.bottom-ir.top));y+=2){
                       for(let x=Math.max(0,Math.ceil(r.left-ir.left));x<Math.min(c.width,Math.floor(r.right-ir.left));x+=2){
                         if(pixels[(y*c.width+x)*4+3]>80){hit=true;break}
                       }
                       if(hit)break;
                     }
                     if(hit)collisions.push(n.textContent[i]);
                   }
                 }
               }
               const box=s=>{const r=document.querySelector(s).getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
               const alphaRows=[0,80,160,240,320,400,480,560].map(y=>{let first=-1;for(let x=0;x<c.width;x++)if(pixels[(y*c.width+x)*4+3]>80){first=x;break}return {y,left:first}});
               return {viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,mascot:box('.hero-mascot'),title:box('.hero h1'),paragraph:box('.hero p'),badges:box('.hero .badges'),hero:box('.hero'),collisions:collisions.join(''),outside:outside.join(''),alphaRows};
             });
             console.log('LAYOUT '+JSON.stringify(result));
             if(width===390||width===320){
               const jpg=await page.locator('.hero').screenshot({type:'jpeg',quality:55});
               console.log('SCREENSHOT_'+width+' '+jpg.toString('base64'));
             }
           }
           const response=await page.request.get('https://idygrafica.netlify.app/assets/mobile-phone-reference.css');
           console.log('LIVE '+JSON.stringify({status:response.status(),existingFix:(await response.text()).includes('Responsividade da página inicial:')}));
           await browser.close();server.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
