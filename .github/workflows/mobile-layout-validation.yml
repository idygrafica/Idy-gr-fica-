name: Confirm institutional WhatsApp publication
on:
  push:
    branches: [codex/mobile-composition-validation]
concurrency:
  group: institutional-mobile-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright pngjs
          npx playwright install --with-deps chromium
      - name: Inspect original asset and published institutional version
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert/strict');
          (async()=>{
           const browser=await chromium.launch(),page=await browser.newPage();
           const base='https://idygrafica.netlify.app/';let published=false;
           for(let attempt=1;attempt<=30;attempt++){
            const token='?verify='+Date.now(),html=await page.request.get(base+token);
            const css=await page.request.get(base+'assets/mobile-phone-reference.css'+token),js=await page.request.get(base+'assets/app.js'+token);
            const htmlText=await html.text();
            const cssMatch=(await css.text()).trim()===fs.readFileSync('assets/mobile-phone-reference.css','utf8').trim();
            const jsMatch=(await js.text()).trim()===fs.readFileSync('assets/app.js','utf8').trim();
            const ok=html.status()===200&&css.status()===200&&js.status()===200&&cssMatch&&jsMatch&&htmlText.includes('<img class="hero-mascot" src="assets/mascote-idy.png" alt="Mascote IDY Gráfica"><h1>');
            console.log('PUBLICATION_CHECK '+JSON.stringify({attempt,htmlStatus:html.status(),cssStatus:css.status(),jsStatus:js.status(),cssMatch,jsMatch,published:ok}));
            if(ok){published=true;break}await page.waitForTimeout(5000);
           }
           assert(published,'New files not yet published by Netlify');
           for(const width of [320,390,430,620,1280]){
            await page.setViewportSize({width,height:1000});await page.goto(base+'?layout='+Date.now());
            await page.evaluate(()=>Promise.all([...document.images].map(e=>e.decode().catch(()=>{}))));await page.waitForTimeout(100);
            const result=await page.evaluate(()=>{
             const img=[...document.querySelectorAll('.hero-mascot')].find(e=>getComputedStyle(e).display!=='none'),r=img.getBoundingClientRect(),w=document.querySelector('.whats-widget'),wr=w.getBoundingClientRect();
             return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,mascotWidth:r.width,mascotSrc:img.getAttribute('src'),whatsReady:w.classList.contains('whats-ready'),onFoot:Math.abs(wr.top-(r.bottom-82))<1,titleColor:getComputedStyle(document.querySelector('.hero h1 span')).color,whatsColor:getComputedStyle(w.querySelector('.whats')).backgroundColor,ai:document.querySelector('.cta-ai-copy strong').innerText,badges:document.querySelectorAll('.hero .badge').length};
            });
            assert.equal(result.scrollWidth,width);assert.equal(result.badges,4);assert.equal(result.ai,'Orçamento com IA');
            if(width<=620){
             assert.equal(result.mascotWidth,405);assert.equal(result.mascotSrc,'assets/mascote-idy.png');assert.equal(result.titleColor,'rgb(53, 238, 72)');assert.equal(result.whatsColor,'rgb(37, 211, 102)');assert(result.whatsReady);assert(result.onFoot);
             const fixed=await page.evaluate(async()=>{
              window.scrollTo({top:300,behavior:'instant'});await new Promise(requestAnimationFrame);const a=document.querySelector('.whats-widget').getBoundingClientRect();
              window.scrollTo({top:600,behavior:'instant'});await new Promise(requestAnimationFrame);const b=document.querySelector('.whats-widget').getBoundingClientRect();
              window.scrollTo({top:0,behavior:'instant'});await new Promise(requestAnimationFrame);return {first:a.top,second:b.top,expected:innerHeight-84};
             });
             assert(Math.abs(fixed.first-fixed.expected)<1);assert(Math.abs(fixed.second-fixed.expected)<1);
             result.fixed=fixed;
            }
            console.log('LIVE_LAYOUT '+JSON.stringify(result));
            if(width===390){
             const height=await page.evaluate(()=>Math.ceil(document.querySelector('.hero').getBoundingClientRect().bottom)+24);await page.setViewportSize({width,height});await page.waitForTimeout(100);
             console.log('LIVE_PREVIEW_390 '+(await page.screenshot({type:'jpeg',quality:75,clip:{x:0,y:0,width,height}})).toString('base64'));
            }
           }
           await browser.close();console.log('PUBLICATION_CONFIRMED commit=49e527f31e2afc54411d26779c1a661f3a3397ab');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
