name: Confirm AI button background
on:
  push:
    branches: [codex/mobile-composition-validation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0267c56edf077977e3d240fd9cb7ec8948eb3631'
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify only the requested background changed and is live
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert/strict'),{execFileSync}=require('child_process');
          (async()=>{
            const path='assets/mobile-phone-reference.css', expected=fs.readFileSync(path,'utf8'), original=execFileSync('git',['show','HEAD^:'+path],{encoding:'utf8'});
            const files=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).trim();
            assert.equal(files,path);
            assert.equal(expected,original.trimEnd()+'\n\n/* Cor do fundo do botão Orçamento com IA. */\n.nav .cta.cta-ai{background:#E53935!important}\n');
            const browser=await chromium.launch(),request=await browser.newPage(),base='https://idygrafica.netlify.app/';
            let live=false;
            for(let attempt=1;attempt<=36;attempt++){
              const response=await request.request.get(base+path+'?verify='+Date.now()),matches=response.ok()&&(await response.text()).trim()===expected.trim();
              console.log('PUBLICATION_CHECK '+JSON.stringify({attempt,status:response.status(),matches}));
              if(matches){live=true;break}await request.waitForTimeout(5000);
            }
            assert(live,'Netlify has not published the updated stylesheet');
            async function snapshot(page){
              return page.evaluate(()=>{
                const button=document.querySelector('.nav .cta.cta-ai');
                const nodes=[button,...button.querySelectorAll('*')];
                return nodes.map((el,index)=>{
                  const c=getComputedStyle(el),styles={};
                  for(const property of c){
                    if(index===0&&['background','background-color','background-image'].includes(property))continue;
                    styles[property]=c.getPropertyValue(property);
                  }
                  const r=el.getBoundingClientRect();
                  return {styles,rect:{x:r.x,y:r.y,width:r.width,height:r.height},text:el.textContent,href:el.getAttribute('href')};
                });
              });
            }
            for(const width of [320,390,1280]){
              const baseline=await browser.newPage({viewport:{width,height:900}}),published=await browser.newPage({viewport:{width,height:900}});
              await baseline.route('**/assets/mobile-phone-reference.css*',route=>route.fulfill({status:200,contentType:'text/css',body:original}));
              for(const page of [baseline,published]){
                await page.goto(base+'?button='+Date.now(),{waitUntil:'networkidle'});
                await page.evaluate(()=>document.fonts.ready);
              }
              assert.deepEqual(await snapshot(published),await snapshot(baseline),'Other button characteristics changed at '+width);
              const color=await published.locator('.nav .cta.cta-ai').evaluate(el=>({background:getComputedStyle(el).backgroundColor,image:getComputedStyle(el).backgroundImage,text:getComputedStyle(el.querySelector('strong')).color}));
              assert.equal(color.background,'rgb(229, 57, 53)');assert.equal(color.image,'none');assert.equal(color.text,'rgb(255, 255, 255)');
              if(width===1280){
                for(const page of [baseline,published]){await page.locator('.nav .cta.cta-ai').hover();await page.waitForTimeout(300)}
                assert.deepEqual(await snapshot(published),await snapshot(baseline),'Other hover characteristics changed');
                assert.equal(await published.locator('.nav .cta.cta-ai').evaluate(el=>getComputedStyle(el).backgroundColor),'rgb(229, 57, 53)');
              }
              console.log('BUTTON_VERIFIED '+JSON.stringify({width,...color,otherStylesAndGeometryUnchanged:true}));
              await baseline.close();await published.close();
            }
            await browser.close();console.log('PUBLICATION_CONFIRMED commit=0267c56edf077977e3d240fd9cb7ec8948eb3631');
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
