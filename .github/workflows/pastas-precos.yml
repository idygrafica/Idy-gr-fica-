name: Pastas com bolsa — preços e publicação autorizada
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - index.html
      - assets/loja/**
      - scripts/pastas-prices/**
      - scripts/approved-prices/**
      - scripts/digital-products/browser.mjs
      - PASTAS_COM_BOLSA_REVISAO.md
      - .github/workflows/pastas-precos.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/loja/**
      - scripts/pastas-prices/**
      - .github/workflows/pastas-precos.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'codex/precos-pastas-com-bolsa' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar os 100 cenários comerciais
        run: |
          node scripts/loja/cart.test.mjs
          node scripts/loja/canetas.test.mjs
          node scripts/digital-products/pricing.test.mjs
          node scripts/approved-prices/pricing.test.mjs
          node scripts/pastas-prices/pricing.test.mjs
          node scripts/seo-technical/build-catalog.mjs
      - name: Preparar navegador isolado
        run: npm install --prefix .preview-tools --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Conferir a prévia de pastas
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--idygrafica.netlify.app
        run: node scripts/pastas-prices/browser.mjs
      - name: Conferir pastas em produção
        if: github.event_name == 'push'
        env:
          VERIFY_ORIGIN: https://idygrafica.com.br
        run: node scripts/pastas-prices/browser.mjs
      - name: Conferir demais preços e produtos digitais
        env:
          VERIFY_ORIGIN: ${{ github.event_name == 'push' && 'https://idygrafica.com.br' || '' }}
        run: |
          node scripts/approved-prices/browser.mjs
          node scripts/digital-products/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pastas-precos-previas-e-testes
          include-hidden-files: true
          path: |
            .preview/pastas-prices/
            .preview/approved-prices/report.json
            .preview/digital-products/report.json
