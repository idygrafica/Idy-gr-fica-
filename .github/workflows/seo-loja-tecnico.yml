name: SEO técnico da loja — auditoria sem publicação
on:
  push:
    branches: [codex/seo-tecnico-loja]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/seo-technical/audit-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-loja-auditoria-publica
          path: .preview/seo-technical/
