[build]
  command = "node scripts/seo-technical/build-catalog.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Arquivos HTML antigos apontam às URLs canônicas.
# Barras finais e acesso aos arquivos estáticos usam a normalização nativa Netlify.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/servicos.html"
  to = "/servicos"
  status = 301
  force = true

