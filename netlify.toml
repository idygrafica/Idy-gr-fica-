[build]
  command = "node scripts/seo-technical/build-catalog.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Consolidar endereços antigos nas URLs canônicas, sem remover páginas.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

